[functions.access-requests]
# Public applications and one-time mail tokens are validated in the handler.
# Review actions additionally verify the JWT and active administrator role.
verify_jwt = false

[functions.document-notifications]
# Database queue dispatches an expiring, single-use random token.
# The handler claims that token server-side and rechecks recipient access.
verify_jwt = false

[functions.quote-requests]
# Public submission is validated server-side; account actions require a verified JWT.
# Mail dispatch requires an expiring single-use database token.
verify_jwt = false

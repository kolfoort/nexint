<main>
  <div class="heading"><h1>اطلب عرض سعر</h1><p>املأ النموذج أدناه وسيتواصل معك فريقنا خلال ساعات.</p></div>
  <form id="quote-form">
    <div class="field"><label for="name">الاسم <span class="required">*</span></label><input id="name" name="Name" autocomplete="name" required></div>
    <div class="field"><label for="company">الشركة <span class="required">*</span></label><input id="company" name="Company" autocomplete="organization" required></div>
    <div class="field"><label for="email">البريد الإلكتروني <span class="required">*</span></label><input id="email" name="E-mail" type="email" autocomplete="email" required></div>
    <div class="field"><label for="phone">رقم الهاتف <span class="required">*</span></label><input id="phone" name="Phone Number" type="tel" autocomplete="tel" required></div>
    <div class="field"><label for="product">نوع المنتج <span class="required">*</span></label><select id="product" name="Product Type" required><option value="">--</option><option value="Premium Gasoline RON 95/98">بنزين ممتاز RON 95/98</option><option value="Ultra-Low Sulphur Diesel (ULSD)">ديزل فائق الانخفاض في الكبريت (ULSD)</option><option value="Jetfuel">وقود الطائرات</option><option value="Group I Base Oils">زيوت أساس المجموعة الأولى</option><option value="Group II Base Oils">زيوت أساس المجموعة الثانية</option><option value="Group III Base Oils">زيوت أساس المجموعة الثالثة</option><option value="(Heavy) Fuel Oil (Marine Fuels, Fuel Oil, HFO)">زيت الوقود الثقيل (الوقود البحري وزيت الوقود وHFO)</option><option value="Hydrotreated Vegetable Oil (HVO)">الزيت النباتي المعالج بالهيدروجين (HVO)</option><option value="Sustainable Aviation Fuel (SAF)">وقود الطيران المستدام (SAF)</option><option value="Naphtha">النافثا</option><option value="Automotive Grade Urea (AGU)">يوريا بدرجة مخصصة للسيارات (AGU)</option><option value="Bitumen">البيتومين</option><option value="Calcium Ammonium Nitrate (CAN)">نترات أمونيوم الكالسيوم (CAN)</option><option value="Urea 46%">يوريا 46%</option><option value="Diammonium Phosphate (DAP)">فوسفات ثنائي الأمونيوم (DAP)</option><option value="Nitrogen Phosphorus Potassium (NPK)">نيتروجين وفوسفور وبوتاسيوم (NPK)</option><option value="Rock Phosphate">صخر الفوسفات</option><option value="Sulphur">الكبريت</option><option value="Bonny Light Crude Oil (BLCO)">نفط بوني الخفيف الخام (BLCO)</option><option value="Crude Oil from the GCC">النفط الخام من دول مجلس التعاون الخليجي</option><option value="SOMO Medium Crude">خام سومو المتوسط</option><option value="ULCC">ULCC</option><option value="VLCC">VLCC</option><option value="OBO">OBO</option><option value="Suezmax">سويزماكس</option><option value="Aframax">أفراماكس</option><option value="LNG | LPG">غاز طبيعي مسال | غاز بترولي مسال</option><option value="Chemical | Product Tanker">ناقلة مواد كيميائية | منتجات نفطية</option><option value="MR Tanker">ناقلة متوسطة المدى (MR)</option><option value="Oil Tanker">ناقلة نفط</option></select></div>
    <div class="field"><label for="quantity">الكمية المطلوبة <span class="required">*</span></label><input id="quantity" name="Requested Quantity" inputmode="decimal" required></div>
    <div class="field"><label for="unit">الوحدة <span class="required">*</span></label><select id="unit" name="Unit" required><option value="">--</option><option value="MT">MT</option><option value="KMT">KMT</option><option value="BBL">BBL</option><option value="KBBL">KBBL</option><option value="Litres">لتر</option><option value="m³">m³</option><option value="Other">أخرى</option></select></div>
    <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="legend">شروط التسليم <span class="required">*</span></legend><div class="choice-list"><label class="choice"><input type="radio" name="Delivery Terms" value="FOB" required> FOB</label><label class="choice"><input type="radio" name="Delivery Terms" value="CFR" required> CFR</label></div></fieldset>
    <div class="field"><label for="port">ميناء التفريغ</label><input id="port" name="Port of Discharge" autocomplete="off"></div>
    <div class="field"><label for="information">معلومات إضافية</label><textarea id="information" name="More Information"></textarea></div>
    <button class="send" type="submit">إرسال</button>
    <p class="note">يؤدي الإرسال إلى فتح رسالة بريد إلكتروني إلى نكسورا تتضمن تفاصيل طلبك.</p>
  </form>
  <a class="back" data-quote-return href="performance-fluids-ar.html">العودة إلى المنتجات</a>
</main>
<script>
const form=document.getElementById('quote-form');
const product=document.getElementById('product');
const requestedProduct=new URLSearchParams(window.location.search).get('product');
if(requestedProduct){
  const option=[...product.options].find(item=>item.value.toLowerCase()===requestedProduct.replaceAll('+',' ').toLowerCase()||item.text.toLowerCase()===requestedProduct.replaceAll('+',' ').toLowerCase());
  if(option) product.value=option.value;
}
form.addEventListener('submit',event=>{
  event.preventDefault();
  if(!form.reportValidity()) return;
  const data=new FormData(form);
  const body=[...data.entries()].map(([key,value])=>`${key}: ${value}`).join('\n');
  const subject=`Quote request — ${product.value}`;
  window.location.href=`mailto:info@nexint.eu?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
});
</script>
<script>document.querySelectorAll('.language-bar a').forEach(a=>{a.href+=window.location.search;});</script>

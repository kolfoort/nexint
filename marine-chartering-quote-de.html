<nav class="language-bar" aria-label="Sprache wählen"><a href="marine-chartering-quote.html" hreflang="en" lang="en" aria-label="English" title="English"><span class="language-flag" aria-hidden="true"><svg viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg"><clipPath id="uk-clip"><path d="M0 0h60v30H0z"/></clipPath><g clip-path="url(#uk-clip)"><path fill="#012169" d="M0 0h60v30H0z"/><path stroke="#fff" stroke-width="6" d="m0 0 60 30m0-30L0 30"/><path stroke="#c8102e" stroke-width="2" d="m0 0 60 30m0-30L0 30"/><path stroke="#fff" stroke-width="10" d="M30 0v30M0 15h60"/><path stroke="#c8102e" stroke-width="6" d="M30 0v30M0 15h60"/></g></svg></span></a><a href="marine-chartering-quote-de.html" hreflang="de" lang="de" aria-label="Deutsch" title="Deutsch" aria-current="page"><span class="language-flag" aria-hidden="true"><svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg"><path fill="#000" d="M0 0h60v14H0z"/><path fill="#d00" d="M0 13.33h60v13.34H0z"/><path fill="#ffce00" d="M0 26.66h60V40H0z"/></svg></span></a><a href="marine-chartering-quote-es.html" hreflang="es" lang="es" aria-label="Español" title="Español"><span class="language-flag" aria-hidden="true"><svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg"><path fill="#aa151b" d="M0 0h60v40H0z"/><path fill="#f1bf00" d="M0 10h60v20H0z"/><g transform="translate(15 14)"><path fill="#eee" stroke="#aa151b" stroke-width=".6" d="M0 1h8v8c0 5-8 5-8 0z"/><path fill="#aa151b" d="M0 1h4v5H0zM4 6h4v4H4z"/><path fill="#f1bf00" d="M1 2h2v3H1zM5 7h2v2H5z"/><path fill="#aa151b" d="M-1 0h10v-2H-1z"/></g></svg></span></a></nav>
<header class="header"><a href="index-de.html" aria-label="NEXORA — zur Startseite"><img class="logo" src="nexora-logo.jpg" alt="NEXORA"></a></header>
<main>
  <div class="heading"><h1>SCHIFFSBEFRACHTUNG</h1><p>Teilen Sie uns Ihre Anforderungen an Schiff und Ladung mit. Unser Team meldet sich innerhalb weniger Stunden bei Ihnen.</p></div>
  <form id="quote-form">
    <div class="field"><label for="name">Name <span class="required">*</span></label><input id="name" name="Name" autocomplete="name" required></div>
    <div class="field"><label for="company">Unternehmen <span class="required">*</span></label><input id="company" name="Unternehmen" autocomplete="organization" required></div>
    <div class="field"><label for="email">E-Mail <span class="required">*</span></label><input id="email" name="E-Mail" type="email" autocomplete="email" required></div>
    <div class="field"><label for="phone">Telefonnummer <span class="required">*</span></label><input id="phone" name="Telefonnummer" type="tel" autocomplete="tel" required></div>
    <div class="field"><label for="vessel">Schiffstyp <span class="required">*</span></label><select id="vessel" name="Schiffstyp" required><option value="">--</option><option value="ULCC">ULCC</option><option value="VLCC">VLCC</option><option value="OBO">OBO</option><option value="Suezmax">Suezmax</option><option value="Aframax">Aframax</option><option value="LNG | LPG">LNG | LPG</option><option value="Chemical | Product Tanker">Chemikalien und Produktentanker</option><option value="MR Tanker">MR Tanker</option><option value="Oil Tanker">Öltanker</option></select></div>
    <div class="field"><label for="quantity">Gewünschte Menge <span class="required">*</span></label><input id="quantity" name="Gewünschte Menge" inputmode="decimal" required></div>
    <div class="field"><label for="unit">Einheit <span class="required">*</span></label><select id="unit" name="Einheit" required><option value="">--</option><option value="BBL">BBL</option><option value="MT">MT</option></select></div>
    <div class="field"><label for="loading-port">Ladehafen</label><input id="loading-port" name="Ladehafen" autocomplete="off"></div>
    <div class="field"><label for="discharge-port">Entladehafen</label><input id="discharge-port" name="Entladehafen" autocomplete="off"></div>
    <div class="field"><label for="information">WEITERE INFORMATIONEN</label><textarea id="information" name="WEITERE INFORMATIONEN"></textarea></div>
    <button class="send" type="submit">SENDEN</button>
    <p class="note">Beim Absenden wird eine E-Mail an NEXORA mit den Angaben Ihrer Anfrage geöffnet.</p>
  </form>
  <a class="back" href="index-de.html#marine-chartering">← ZURÜCK ZUR SCHIFFSBEFRACHTUNG</a>
</main>
<script>
const form=document.getElementById('quote-form');
const vessel=document.getElementById('vessel');
const requestedVessel=new URLSearchParams(window.location.search).get('vessel');
if(requestedVessel){
  const option=[...vessel.options].find(item=>item.value.toLowerCase()===requestedVessel.replaceAll('+',' ').toLowerCase()||item.text.toLowerCase()===requestedVessel.replaceAll('+',' ').toLowerCase());
  if(option) vessel.value=option.value;
}
form.addEventListener('submit',event=>{
  event.preventDefault();
  if(!form.reportValidity()) return;
  const data=new FormData(form);
  const body=[...data.entries()].map(([key,value])=>`${key}: ${value}`).join('\n');
  const subject=`Charteranfrage — ${vessel.value}`;
  window.location.href=`mailto:info@nexora-int.eu?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
});
</script>
<script>document.querySelectorAll('.language-bar a').forEach(a=>{a.href+=window.location.search;});</script>
